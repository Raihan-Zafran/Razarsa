name: Build APK

# Jalan otomatis setiap ada push, pull request, atau dijalankan manual dari tab Actions.
# Push tag berawalan "v" (contoh: v1.0.0) juga membuat GitHub Release berisi APK.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rilis:
        description: "Buat GitHub Release dengan tag ini (contoh v1.0.0-beta). Kosongkan kalau cuma build."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Cek kode & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Unduh paket
        run: flutter pub get

      - name: Cek kode (analyze)
        run: flutter analyze

      - name: Jalankan tes
        run: flutter test

      # Kunci rilis dari GitHub Secrets (Settings > Secrets and variables > Actions).
      # Kalau secret belum diisi, APK tetap jadi tapi memakai kunci debug.
      - name: Pasang kunci rilis
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/razarsa-release.jks
            {
              echo "storeFile=razarsa-release.jks"
              echo "storePassword=$RELEASE_STORE_PASSWORD"
              echo "keyPassword=$RELEASE_KEY_PASSWORD"
              echo "keyAlias=$RELEASE_KEY_ALIAS"
            } > android/key.properties
            echo "Kunci rilis dipasang."
          else
            echo "::warning::Secret kunci rilis belum diisi. APK memakai kunci debug (jangan dibagikan luas)."
          fi

      - name: Build APK
        run: |
          # APK kecil untuk HP modern (arm64) + APK universal untuk semua HP.
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} -P force-version-code-ignoring-abi=true
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Beri nama file APK
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          BASE="razarsa-v${VERSION}-build${{ github.run_number }}"
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/${BASE}-arm64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "dist/${BASE}-universal.apk"
          ls -la dist
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Simpan APK (tab Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.base }}
          path: dist/*.apk
          retention-days: 30

      - name: Tentukan rilis
        id: rel
        run: |
          TAG="${{ github.event.inputs.rilis }}"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          # Rilis otomatis: push ke branch utama dengan versi baru di pubspec.yaml.
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              TAG="v$VERSION"
              echo "Versi baru $VERSION, rilis otomatis dibuat."
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ ! -f android/key.properties ]; then
            echo "::error::Rilis butuh kunci rilis. Isi 4 secret RELEASE_* dulu, lalu jalankan ulang."
            exit 1
          fi
          NOTES="docs/rilis/$TAG.md"
          [ -f "$NOTES" ] || NOTES=""
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Buat GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Razarsa ${{ steps.rel.outputs.tag }}
          body_path: ${{ steps.rel.outputs.notes }}
          generate_release_notes: ${{ steps.rel.outputs.notes == '' }}
          prerelease: ${{ contains(steps.rel.outputs.tag, '-') }}
          files: dist/*.apk
